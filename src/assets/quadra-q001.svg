<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 680" role="img" aria-labelledby="title">
  <title id="title">Quadra Q-001 compact CRT</title>
  <defs>
    <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.25" fill="#0a3dff"/>
    </pattern>
    <pattern id="dense-dots" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.9" fill="#0a3dff"/>
    </pattern>
    <pattern id="scanlines" width="4" height="5" patternUnits="userSpaceOnUse">
      <path d="M0 4.5h4" stroke="#171b29" stroke-opacity=".3"/>
    </pattern>
    <path id="side-shape" d="M388 61 536 107q13 4 19 17l31 58v369q0 13-13 20l-158 55q-11 4-25 0l-33-15z"/>
    <path id="glass-shape" d="M168 133q87-8 192-8 11 0 11 13l-13 229q-1 12-13 14-109 5-206-5-10-1-9-13l24-217q1-11 14-13z"/>
    <clipPath id="side-clip"><use href="#side-shape"/></clipPath>
    <clipPath id="glass-clip"><use href="#glass-shape"/></clipPath>
    <radialGradient id="glass-glow" cx=".5" cy=".42" r=".68">
      <stop stop-color="#2445ee"/>
      <stop offset=".72" stop-color="#2422cf"/>
      <stop offset="1" stop-color="#161775"/>
    </radialGradient>
  </defs>

  <g id="computer" transform="translate(-26 58) scale(1.07 .91)">
    <g id="contact-shadow">
      <path d="m124 607 254-37 230 24-86 44-216 26-175-27z" fill="url(#dots)"/>
      <path d="m145 617 250-27 148 12-74 31-181 15z" fill="url(#dense-dots)"/>
    </g>

    <g id="housing" stroke="#24221e" stroke-width="2.5" stroke-linejoin="round">
      <use href="#side-shape" fill="#e4ddcd"/>
      <g clip-path="url(#side-clip)" stroke="none">
        <path d="M410 63h182v571H385z" fill="url(#dots)"/>
        <path d="m528 101 76 53v475H487z" fill="url(#dense-dots)" opacity=".68"/>
      </g>
      <path d="M113 529 398 542l-8 84q-4 9-17 9l-250-17q-14-2-14-15l-2-48z" fill="#d8d0bf"/>
      <path d="M119 553 391 569l-5 38-258-17q-7-1-8-8z" fill="#bdb4a3" stroke="none"/>
      <path d="M135 73 384 60q24-1 23 24l-16 492q0 20-20 20L97 578q-21-2-19-24l42-458q2-22 15-23z" fill="#f4f0e6"/>
      <path d="M138 80 383 68q15-1 15 14l-17 485q0 18-14 19L98 569q-12-1-12-15l40-459q2-14 12-15z" fill="none" stroke="#fffdf6" stroke-width="3"/>
      <path d="M95 461 394 472" fill="none" stroke-width="1.7"/>
      <path d="m95 465 298 11" stroke="#fffdf6" stroke-width="1.5"/>
      <path d="m249 461 114 4q3 0 3 3v6l-117-4z" fill="#24221e" stroke-width="1"/>
      <circle cx="375" cy="470" r="2" fill="#24221e" stroke="none"/>
    </g>

    <g id="right-vents" fill="none" stroke="#24221e" stroke-width="4" stroke-linecap="round">
      <path d="m432 542 134-43m-134 55 134-43m-134 55 134-43"/>
    </g>

    <g id="screen">
      <path d="M159 112q93-8 212-9 18 0 17 18l-15 259q-1 19-19 20-115 5-226-7-17-2-15-19l26-244q2-16 20-18z" fill="#afa99d"/>
      <path d="M153 127 164 132l-24 238 217 10 11 13q-5 6-14 7-115 5-226-7-17-2-15-19l26-244z" fill="#e8e1d2"/>
      <use href="#glass-shape" fill="url(#glass-glow)" stroke="#171b29" stroke-width="4"/>
      <g clip-path="url(#glass-clip)">
        <path d="M125 120h255v267H125z" fill="url(#scanlines)"/>
        <path d="m163 169 65-29m-69 53 107-49" stroke="#fffdf6" opacity=".16" stroke-width="2"/>
        <g id="screen-content"/>
      </g>
    </g>

    <g id="quadra-badge" transform="translate(107 433)">
      <rect width="20" height="20" rx="2" fill="#2422cf"/>
      <path d="M13.6 6v10.5m-.1-7.2c0-2-1.1-3.2-2.9-3.2-1.7 0-3 1.4-3 3.2 0 1.9 1.2 3.3 2.9 3.3 1.8 0 3-1.4 3-3.3Z" fill="none" stroke="#fffdf6" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>
