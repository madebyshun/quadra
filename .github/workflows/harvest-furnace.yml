name: Harvest QuadraFurnace

on:
  schedule:
    # Every 6 hours UTC
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force harvest even below fee threshold"
        required: false
        default: "false"

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - name: Run QuadraFurnace harvest keeper
        env:
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL }}
          HARVEST_PRIVATE_KEY: ${{ secrets.HARVEST_PRIVATE_KEY }}
          MIN_ETH: "0.0001"
          MIN_QUADRA: "10000"
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: npx vite-node scripts/harvest-furnace.ts
