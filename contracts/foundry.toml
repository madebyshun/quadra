# The launchpad's contracts. Built and tested with Base Foundry (`base-forge`), the fork of
# Foundry that knows Base's native precompiles — the B20 factory above all. Stock `forge`
# cannot reach 0xB20f…0000 and aborts with "call to non-contract address".
[profile.default]
src = "src"
test = "test"
out = "out"
# v4-core and v4-periphery come from npm (`../node_modules/@uniswap/…`) and are reached through
# the symlinks in lib/: MEASURED, forge's analyser ("solar", used by `coverage`) cannot resolve a
# relative import inside a library that lives outside the project root, though `build` can.
libs = ["lib"]

# Uniswap v4's PoolManager is pinned to exactly 0.8.26, and the tests deploy the real one.
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false

# Warnings are failures in contracts that hold other people's liquidity. See the archived
# privacy contracts' foundry.toml for why the key lives HERE and not under [lint]:
# `forge config | grep deny` is the check, never "the build passed".
deny = "warnings"

# LaunchFactoryV3.t.sol reads the sources it checks ("no code path removes liquidity"). Read-only,
# and only src/.
fs_permissions = [{ access = "read", path = "./src" }]

remappings = [
  "base-std/=lib/base-std/src/",
  "@uniswap/v4-core/=lib/v4-core/",
  "@uniswap/v4-periphery/=lib/v4-periphery/",
  "forge-std/=lib/v4-core/lib/forge-std/src/",
  "solmate/=lib/v4-core/lib/solmate/",
]

[lint]
ignore = ["test/*", "test/**/*"]

[fuzz]
runs = 512
