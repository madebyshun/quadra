<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover"
    />
    <title>Quadra</title>
    <meta
      name="description"
      content="An on-chain supercomputer for Base. Look up any token or wallet, scan for traps before you act, then send, swap or launch a coin — every action checked before it reaches your wallet, and signed there. It never holds your key."
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Quadra" />
    <meta
      property="og:description"
      content="An on-chain supercomputer for Base: research, safety scans, send, swap and launch — signed in your own wallet. In development."
    />
    <meta property="og:site_name" content="Quadra" />
    <meta property="og:image" content="https://quadra-eta.vercel.app/brand/computer-sky-og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A personal computer floating above the ocean under a blue sky" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://quadra-eta.vercel.app/brand/computer-sky-og.jpg" />

    <link rel="icon" type="image/svg+xml" href="/brand/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#5f7d9c" />
    <!-- Inter (chrome and text) and JetBrains Mono (addresses): both SIL Open Font License 1.1, Google Fonts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&family=JetBrains+Mono:wght@400;500&display=swap" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Quadra" />

    <!-- The desktop, before any script has loaded: the default Platinum desktop. Without this the
         page opens white and jumps to it once the bundle arrives. -->
    <style>
      html,
      body {
        margin: 0;
        background-color: #5f7d9c;
      }
      body {
        min-height: 100vh;
        background-image: conic-gradient(#63819f 0 25%, #5f7d9c 0 50%, #63819f 0 75%, #5f7d9c 0);
        background-size: 4px 4px;
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
